<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#36255C" />
      <stop offset="50%" stop-color="#1A112E" />
      <stop offset="100%" stop-color="#0E0919" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#D2C3F6" />
      <stop offset="100%" stop-color="#9B72CF" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D2C3F6" />
      <stop offset="50%" stop-color="#683FB5" />
      <stop offset="100%" stop-color="#D2C3F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Circle Badge with Gradient -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle Inner Ring Accent -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="#D2C3F6" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 3" />

  <!-- Atelier Scissor Artistry Icon -->
  <g transform="translate(32, 32) rotate(-35) translate(-32, -32)" filter="url(#glow)">
    <!-- Left Scissor Blade & Handle -->
    <path
      d="M32 30 L45 13 C46 11.5 45 10 43 11 L29 27 M32 34 L21 44 C19 46 16 46 14.5 44 C13 42 13 39 15 37 C17 35 20 35 22 37 L29 32"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Left Finger Loop -->
    <circle cx="16.5" cy="41.5" r="4.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Right Scissor Blade & Handle -->
    <path
      d="M32 30 L19 13 C18 11.5 19 10 21 11 L35 27 M32 34 L43 44 C45 46 48 46 49.5 44 C51 42 51 39 49 37 C47 35 44 35 42 37 L35 32"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Right Finger Loop -->
    <circle cx="47.5" cy="41.5" r="4.5" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Pivot Screw Stud -->
    <circle cx="32" cy="31" r="2.5" fill="#FAF7FD" stroke="#36255C" stroke-width="1" />
  </g>

  <!-- Top Right Sparkle Star -->
  <path d="M48 12 Q48 16 52 16 Q48 16 48 20 Q48 16 44 16 Q48 16 48 12 Z" fill="#FAF7FD" opacity="0.95" />
</svg>